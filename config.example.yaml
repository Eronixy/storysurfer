reddit:
  # Credentials are environment-only: REDDIT_CLIENT_ID and REDDIT_CLIENT_SECRET.
  # Use REDDIT_USER_AGENT or replace this non-identifying development value locally.
  user_agent: "linux:redditsurfer:0.1.0 (development)"
  comment_sort: "best"
  max_comments: 250
  replace_more_limit: 8

selection:
  target_duration_seconds: 75
  words_per_minute: 165
  comment_budget_fraction: 0.25
  max_comment_depth: 8
  max_candidate_words: 220
  max_selected_candidates: 5

storage:
  runs_dir: "runs"

media:
  ffmpeg_path: "ffmpeg"
  ffprobe_path: "ffprobe"

speech:
  # Run `uv run edge-tts --list-voices` to browse available voice names.
  provider: "edge-tts"
  voice: "en-US-EmmaMultilingualNeural"
  rate: "+0%"
  volume: "+0%"
  pitch: "+0Hz"
  segment_pause_ms: 350
  connect_timeout_seconds: 10
  receive_timeout_seconds: 60
  pronunciations:
    AITA: "am I the asshole"
