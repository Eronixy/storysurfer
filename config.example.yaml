reddit:
  # Credentials are environment-only: REDDIT_CLIENT_ID and REDDIT_CLIENT_SECRET.
  # Use REDDIT_USER_AGENT or replace this non-identifying development value locally.
  user_agent: "linux:redditsurfer:0.1.0 (development)"
  comment_sort: "best"
  max_comments: 250
  replace_more_limit: 8

selection:
  target_duration_seconds: 75
  words_per_minute: 165
  comment_budget_fraction: 0.25
  max_comment_depth: 8
  max_candidate_words: 220
  max_selected_candidates: 5

storage:
  runs_dir: "runs"

media:
  ffmpeg_path: "ffmpeg"
  ffprobe_path: "ffprobe"
  output_width: 1080
  output_height: 1920
  frame_rate: 30
  video_codec: "libx264"
  audio_codec: "aac"
  crf: 20
  encoder_preset: "medium"
  # Gameplay audio is removed unless this is explicitly enabled.
  retain_background_audio: false
  background_volume: 0.12
  # Preview renders use a faster, lower-resolution profile.
  preview_width: 540
  preview_height: 960
  preview_crf: 28
  preview_encoder_preset: "veryfast"
  duration_tolerance_ms: 150

captions:
  # Font family is resolved by FFmpeg/libass through fontconfig.
  font_name: "DejaVu Sans"
  font_size: 72
  primary_color: "#FFFFFF"
  highlight_color: "#FFD54F"
  outline_color: "#000000"
  outline_size: 5
  min_words: 2
  max_words: 5
  max_characters: 32
  gap_break_ms: 420
  tail_ms: 80
  pop_ms: 120
  margin_horizontal: 90
  margin_bottom: 430

speech:
  # Run `uv run edge-tts --list-voices` to browse available voice names.
  provider: "edge-tts"
  voice: "en-US-EmmaMultilingualNeural"
  rate: "+0%"
  volume: "+0%"
  pitch: "+0Hz"
  segment_pause_ms: 350
  connect_timeout_seconds: 10
  receive_timeout_seconds: 60
  pronunciations:
    AITA: "am I the asshole"
